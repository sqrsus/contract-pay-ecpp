[workspace]
resolver = "2"
members = [
    "crates/ctp-core",
    "crates/ctp-store",
    "crates/ctp-app",
    "crates/ctp-gui",
]

[workspace.package]
# 项目版本唯一真源：四个 crate 均用 version.workspace = true 继承。
# 界面状态栏 / 登录页 / Excel 导出页脚均由 env!("CARGO_PKG_VERSION") 自动读取，
# 不要在代码或文档里硬编码版本串，升级只改这一行。
version = "0.5.11"
edition = "2021"

[workspace.dependencies]
ctp-core = { path = "crates/ctp-core" }
ctp-store = { path = "crates/ctp-store" }
ctp-app = { path = "crates/ctp-app" }
thiserror = "1"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
