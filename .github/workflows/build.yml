name: build

# 触发条件：
#   - push 到 main            → 跑测试 + 编 release，产物作为 artifact 保留 30 天
#   - 向 main 提 PR           → 只跑测试，避免重复构建
#   - 推送 v* 标签            → 额外创建 GitHub Release，附上 Windows 二进制与校验和
#   - 手动 workflow_dispatch → 按需重跑
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# R-39 最小权限：顶层只读，只有发布 Release 的 job 单独提权到 write。
permissions:
  contents: read

# 同一分支的旧构建自动取消，避免连续提交堆叠排队（标签发布不取消）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 增量编译在 CI 里只增体积不加速，关掉让缓存更小
  CARGO_INCREMENTAL: "0"

jobs:
  # ---------------------------------------------------------------------------
  # 第 1 关：全量测试。不过测试就不进入构建，省下的 runner 时间比排队更值。
  # ctp-gui 依赖 eframe/egui，Linux 下编译需要 X11 / Wayland / OpenGL 头文件，
  # 用 cargo test --workspace 编译它之前必须先装好这些系统库。
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      # R-39：第三方 Action 一律 pin 到完整 commit SHA（tag 可被移动）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Linux 图形依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test

      # R-39：CI 补格式与静态检查，避免「能编译但风格/lint 漂移」
      - name: 安装 rustfmt / clippy
        run: rustup component add rustfmt clippy

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------
  # 第 2 关：编译 release profile 的可执行文件。
  # Windows 用 msvc 目标（runner 自带 VS Build Tools，rusqlite bundled 能直接编 sqlite3.c）。
  # 【临时调整】Linux 产物暂停构建，只保留 Windows 版；matrix 结构刻意保留，
  # 恢复时只需把下面 include 里的 ubuntu-latest 一项加回来，并恢复「安装 Linux 图形依赖」步骤。
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.artifact }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ctp-windows-x64
            bin: ctp-gui.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.artifact }}

      - name: 编译 release
        run: cargo build --release --locked -p ctp-gui

      - name: 记录产物大小与校验和
        shell: bash
        run: |
          set -euo pipefail
          ls -lh "target/release/${{ matrix.bin }}"
          sha256sum "target/release/${{ matrix.bin }}"

      - name: 上传产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 第 3 关：只有打 v* 标签才发布。把产物下载下来，
  # 生成 SHA256SUMS.txt 一并挂到 Release，便于分发时校验完整性。
  # ---------------------------------------------------------------------------
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # 只有这个 job 需要创建 Release / 上传资产
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          set -euo pipefail
          cd artifacts
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 本 job 没有 checkout，gh 无法从 git remote 推断仓库，必须显式指定
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
