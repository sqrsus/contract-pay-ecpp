name: build

# 触发条件：
#   - push 到 main            → 测试 + 编 release，并按 Cargo.toml 版本号自动打标签、发布 Release
#   - 推送 v* 标签            → 同一套发布流程，按标签名发布（手工打标签的场景仍然可用）
#   - 向 main 提 PR           → 只跑测试与构建，不发版
#   - 手动 workflow_dispatch  → 按需重跑；版本已发过时会自动跳过，不会重复发版
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# R-39 最小权限：顶层只读，只有发布 Release 的 job 单独提权到 write。
permissions:
  contents: read

# 同一分支的旧构建自动取消，避免连续提交堆叠排队；标签发布不允许被取消，
# 否则可能出现「tag 已推、Release 没建完」的半成品。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  CARGO_TERM_COLOR: always
  # 增量编译在 CI 里只增体积不加速，关掉让缓存更小
  CARGO_INCREMENTAL: "0"

jobs:
  # ---------------------------------------------------------------------------
  # 第 1 关：全量测试。不过测试就不进入构建，省下的 runner 时间比排队更值。
  # ctp-gui 依赖 eframe/egui，Linux 下编译需要 X11 / Wayland / OpenGL 头文件，
  # 用 cargo test --workspace 编译它之前必须先装好这些系统库。
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      # R-39：第三方 Action 一律 pin 到完整 commit SHA（tag 可被移动）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Linux 图形依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test

      # R-39：CI 补格式与静态检查，避免「能编译但风格/lint 漂移」
      - name: 安装 rustfmt / clippy
        run: rustup component add rustfmt clippy

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------
  # 第 2 关：编译 release profile 的可执行文件。
  # Windows 用 msvc 目标（runner 自带 VS Build Tools，rusqlite bundled 能直接编 sqlite3.c）。
  # 【临时调整】Linux 产物暂停构建，只保留 Windows 版；matrix 结构刻意保留，
  # 恢复时只需把下面 include 里的 ubuntu-latest 一项加回来，并恢复「安装 Linux 图形依赖」步骤。
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.artifact }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ctp-windows-x64
            bin: ctp-gui.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.artifact }}

      - name: 编译 release
        run: cargo build --release --locked -p ctp-gui

      - name: 记录产物大小与校验和
        shell: bash
        run: |
          set -euo pipefail
          ls -lh "target/release/${{ matrix.bin }}"
          sha256sum "target/release/${{ matrix.bin }}"

      - name: 上传产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 第 3 关：发布 Release。PR 不发布，其余触发都走这里。
  #
  # 版本号与标签规则：
  #   - push 到 main：读 Cargo.toml 的 [workspace.package] version（唯一真源）→ 标签 v<version>
  #   - push v* 标签：直接用该标签名，并从标签名反解版本号
  #   - 该版本已存在 Release 时整段跳过：改文档 / 调 CI / 重复推送都不会重复发版
  #
  # 发布说明：--generate-notes 自动汇总「上一个 v* 标签 → 本次」之间的提交与 PR，
  #           --notes-start-tag 显式指定起点，避免把更早的历史也带进来。
  #           如需按 PR 标签分组，可另加 .github/release.yml 定制分类。
  #
  # 发布资产（三件）：
  #   ctp-gui-<版本>-windows-x64.exe    可直接运行，便于老用户沿用习惯
  #   ctp-gui-<版本>-windows-x64.zip    同一 exe 的体积压缩版，供下载慢的场景
  #   SHA256SUMS.txt                    前两者的校验和
  # GitHub 不对 Release 资产做二次压缩，exe 直传时用户下载的就是 10 MB 全量；
  # 打成 zip 后实际下载量约减半，且不改动程序本身（无需重新编译、不改变校验逻辑）。
  # ---------------------------------------------------------------------------
  release:
    name: 发布 Release
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    # 只有这个 job 需要建标签 / 建 Release / 传资产
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 需要完整历史：git describe 要找到上一个 v* 标签来界定发布说明的范围
          fetch-depth: 0

      - name: 解析版本号与标签
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            # Cargo.toml 里只有 [workspace.package] 下的 version 顶格书写
            VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
            TAG="v${VERSION}"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::无法解析版本号（得到 '${VERSION}'），请检查 Cargo.toml 的 workspace.package.version"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "版本 ${VERSION} → 标签 ${TAG}"

      - name: 判断该版本是否已发布
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} 已存在 Release，本次跳过发布（版本号未变即视为无需发版）"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建并推送标签
        if: ${{ steps.guard.outputs.exists == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "远端已存在标签 ${TAG}，直接复用"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "release ${TAG}"
            # 用 GITHUB_TOKEN 推标签不会再次触发 workflow，天然避免自我循环
            git push origin "refs/tags/${TAG}"
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ steps.guard.outputs.exists == 'false' }}
        with:
          path: artifacts
          merge-multiple: true

      - name: 重命名产物、打包 zip 并生成校验和
        if: ${{ steps.guard.outputs.exists == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          cd artifacts
          EXE="ctp-gui-${VERSION}-windows-x64.exe"
          ZIP="ctp-gui-${VERSION}-windows-x64.zip"
          mv ctp-gui.exe "${EXE}"
          # runner 镜像自带 zip；万一某天缺失就补装，避免发版卡在缺工具上
          command -v zip >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq zip
          }
          # -9 最高压缩率；-X 去掉 uid/时间等多余字段，同样的 exe 每次压出同样的包
          zip -9 -X "${ZIP}" "${EXE}"
          sha256sum ./*.exe ./*.zip > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: 创建 Release
        if: ${{ steps.guard.outputs.exists == 'false' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 本 job 的 checkout 在子目录之外，gh 仍无法可靠推断仓库，显式指定
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          ARGS=(--title "${TAG}" --generate-notes --verify-tag --latest)
          PREV="$(git describe --tags --abbrev=0 --match 'v*' "refs/tags/${TAG}^" 2>/dev/null || true)"
          if [[ -n "${PREV}" ]]; then
            ARGS+=(--notes-start-tag "${PREV}")
            echo "发布说明范围：${PREV} .. ${TAG}"
          else
            echo "未找到更早的 v* 标签，发布说明将覆盖全部历史"
          fi
          gh release create "${TAG}" artifacts/* "${ARGS[@]}"
