[package]
name = "ctp-app"
version.workspace = true
edition.workspace = true
description = "工程合同台账与拨款管理平台 —— 应用服务（合同、审计价、拨款、对账）"

[dependencies]
ctp-core.workspace = true
ctp-store.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
serde_json.workspace = true
# 报表导出：write-only（只能新建 xlsx，不能读取/修改已有模板）。
# 打印不走模板填充，见 print.rs / paper.rs 与文档 ADR-06 / R-28。
rust_xlsxwriter = "0.102"

# 打印：只用 Windows 自带 GDI + 通用打印对话框，不依赖 Word / Edge。
# StartDocW / StartPage / EndPage / EndDoc / DOCINFOW 在 Storage::Xps 下（gdi32 导出）。
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_UI_Controls_Dialogs",
] }
