[package]
name = "ctp-gui"
version.workspace = true
edition.workspace = true
description = "工程合同台账与拨款管理平台 —— 桌面界面（egui）"

[[bin]]
name = "ctp-gui"
path = "src/main.rs"

[dependencies]
ctp-core.workspace = true
ctp-store.workspace = true
ctp-app.workspace = true
rusqlite.workspace = true
eframe = "0.29"
egui_extras = "0.29"
rfd = "0.14"
# 取主窗口 HWND 作为打印对话框的 owner（版本需与 eframe 内部一致）
raw-window-handle = "0.6"
